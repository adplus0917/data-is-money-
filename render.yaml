# Render Blueprint: one web service + one PostgreSQL database + a private disk for samples.
# In Render: New → Blueprint → pick this repo. Render reads this file and builds everything.
services:
  - type: web
    name: data-patrimonio
    runtime: node
    plan: starter            # paid plan needed for the persistent disk below
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: samples
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: data-patrimonio-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false          # Render asks you to type it in during setup
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: NOTIFY_WEBHOOK_URL
        sync: false
      - key: OUTBOX_FROM
        value: hola@dataismoney.ai
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: hola@dataismoney.ai
      - key: SMTP_APP_PASSWORD
        sync: false          # App Password on the hola@ Google account; set by hand in the Render dashboard (or via the Render API once generated), never in the repo
      - key: LEAD_INTAKE_TOKEN
        sync: false          # token for the Meta instant-form lead intake (POST /api/intake/meta); set by hand in the Render dashboard, never in the repo
databases:
  - name: data-patrimonio-db
    plan: basic-256mb
