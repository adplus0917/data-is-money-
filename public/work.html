<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My folders — Data Is Money</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #0d0f12; color: #e8e6df; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid #262a30; }
  header .brand { font-weight: 700; letter-spacing: .02em; }
  header .brand span { color: #c9a227; }
  main { max-width: 860px; margin: 0 auto; padding: 20px; }
  .card { background: #15181d; border: 1px solid #262a30; border-radius: 12px; padding: 18px; margin-bottom: 14px; }
  label { display: block; font-size: 13px; color: #a7a396; margin: 10px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid #333842; background: #0d0f12; color: #e8e6df; }
  button { background: #c9a227; color: #141414; border: 0; border-radius: 8px; padding: 9px 16px; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: #a7a396; border: 1px solid #333842; }
  button.small { padding: 5px 12px; font-size: 13px; }
  .err { color: #ff8a7a; font-size: 14px; min-height: 18px; }
  .muted { color: #a7a396; font-size: 13px; }
  .customer { cursor: pointer; }
  .customer:hover { border-color: #c9a227; }
  .folder { margin-top: 12px; }
  .folder h4 { margin: 0 0 6px; font-size: 14px; text-transform: capitalize; }
  .file { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid #20242a; font-size: 14px; }
  .lock { color: #c9a227; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <div class="brand">DATA <span>IS MONEY</span> — my folders</div>
  <div>
    <span id="who" class="muted"></span>
    <button id="logout" class="ghost small hidden">Sign out</button>
  </div>
</header>
<main>
  <section id="login" class="card hidden">
    <h2 style="margin-top:0">Worker sign in</h2>
    <p class="muted">Use the worker account your admin gave you. This page only shows the customers assigned to you.</p>
    <label for="username">Username</label>
    <input id="username" autocomplete="username">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <p class="err" id="login-err"></p>
    <button id="login-btn">Sign in</button>
  </section>

  <section id="app" class="hidden">
    <h2 style="margin:6px 0 12px">My customers</h2>
    <div id="customers"></div>
    <div id="detail"></div>
  </section>
</main>
<script src="/work.js"></script>
</body>
</html>
