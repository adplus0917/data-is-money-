<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DATA Patrimonio</title>
<meta name="description" content="Find out what your company's historical data is worth. Valora los datos de tu empresa en 2 minutos.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;500;600&family=Great+Vibes&family=Dancing+Script:wght@600&family=Allura&family=Caveat:wght@600&family=Sacramento&family=Kalam&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
<header class="top">
  <a class="brand" href="#">
    <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
      <polygon fill="#c9a227" points="22,1 25.5,8.2 33.1,4.8 32.1,12.9 40.2,13.3 35.5,19.9 42.3,24.4 34.6,27 37.2,34.7 29.3,33.4 27.6,41.4 22,35.6 16.4,41.4 14.7,33.4 6.8,34.7 9.4,27 1.7,24.4 8.5,19.9 3.8,13.3 11.9,12.9 10.9,4.8 18.5,8.2"/>
      <circle cx="22" cy="22" r="11.5" fill="#0b1a33"/>
      <circle cx="17.8" cy="20" r="1.6" fill="#e6c452"/><circle cx="26.2" cy="20" r="1.6" fill="#e6c452"/>
      <path d="M19 24.5h6l-3 3.2z" fill="#e6c452"/><path d="M22 27.7v2.3M18.5 30.5q3.5 2 7 0" stroke="#e6c452" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    </svg>
    <span><b>DATA PATRIMONIO</b><small id="tag"></small></span>
  </a>
  <div class="right">
    <button class="pill fbnav" type="button" id="fbTop"></button>
    <div role="group" aria-label="Language" style="display:flex;gap:4px">
      <button class="pill" type="button" data-lang="en" aria-pressed="true">EN</button>
      <button class="pill" type="button" data-lang="es" aria-pressed="false">ES</button>
    </div>
  </div>
</header>
<nav class="topnav" id="topnav" aria-label="DATA Patrimonio"></nav>

<section class="hero" data-view="inicio">
  <canvas id="hero-canvas" aria-hidden="true"></canvas>
  <div class="hero-veil" aria-hidden="true"></div>
  <div class="hero-inner">
    <div class="hero-copy">
      <h1 id="heroT"></h1><p id="heroP"></p>
      <div class="cta"><a class="btn go" href="#start" id="ctaBtn"></a>
        <button class="btn-sound" id="sound-toggle" type="button" aria-pressed="false" aria-label="Activar o silenciar la música ambiental">
          <svg id="sound-icon-off" width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4Z" fill="currentColor"/><path d="M15.5 9.5l5 5M20.5 9.5l-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <svg id="sound-icon-on" width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="display:none;"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4Z" fill="currentColor"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6M18 6.8a7.4 7.4 0 0 1 0 10.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span id="sound-label">Escuchar música</span><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span class="dot" aria-hidden="true"></span>
        </button>
      </div>
      <p class="hero-trust"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3l7 2.6v5.2c0 4.6-3 8.4-7 10.2-4-1.8-7-5.6-7-10.2V5.6L12 3Z" stroke="#c9a227" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 11.8l2.1 2.1L15.4 9.6" stroke="#e6c452" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="trust" id="trust"></span></p>
      <audio id="ambient-audio" src="/assets/ambient-bed.mp3" loop preload="auto"></audio>
    </div>
    <div class="video-frame">
      <video src="/assets/hero-owner.mp4" autoplay muted loop playsinline preload="auto" aria-label="Dueño de negocio trabajando en su computadora"></video>
      <span class="video-chip"><span class="pulse" aria-hidden="true"></span><span id="heroChip"></span></span>
    </div>
  </div>
</section>
<main class="wrap" id="start" aria-live="polite" data-view="valua">
  <div class="bar" id="bar"></div>
  <div class="stepnames" id="stepnames"></div>
  <div class="card" id="panel"></div>
</main>
<section class="band" id="how" data-view="inicio como"></section>
<section class="band" id="market" data-view="inicio"></section>
<section class="band" id="seguridad" data-view="seguridad"></section>
<section class="band" id="faq" data-view="preguntas"></section>
<section class="band" id="contacto" data-view="contacto"></section>
<footer id="foot"></footer>
<div id="chatRoot"></div>
<div id="fbRoot"></div>

<!-- load order matters: engine (prices) → i18n (words) → app (the funnel) -->
<script src="/engine.js"></script>
<script src="/i18n.js?v=5"></script>
<script src="/app.js?v=6"></script>
<script src="/hero-fx.js"></script>
</body>
</html>
